name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install offline test dependency
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # Offline only. Live endpoint runs are not part of this workflow.
      - name: Run unit tests
        run: python3 -m pytest tests/ -q

      - name: Recount committed JSON against the README
        run: python3 scripts/check_claims.py

      - name: Offline mock fixture
        run: python3 scripts/run_benchmark.py --client mock --oracle --seq-lens 128 --positions 0.0 --repeats 1 --task single_needle --output-dir artifacts/offline
